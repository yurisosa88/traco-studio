<ul class="contact-methods" aria-label="Canais de contato">
  @for (method of visibleMethods; track method.id) {
    <li>
      <a
        class="contact-methods__link"
        [class.contact-methods__link--primary]="method.primary"
        [href]="method.href"
        [attr.target]="method.type === 'email' ? null : '_blank'"
        [attr.rel]="method.type === 'email' ? null : 'noopener noreferrer'"
      >
        <span class="contact-methods__icon" aria-hidden="true">
          @switch (method.type) {
            @case ('whatsapp') {
              <svg viewBox="0 0 24 24" fill="none" focusable="false">
                <path d="M20 11.7a8 8 0 0 1-11.8 7L4 20l1.3-4A8 8 0 1 1 20 11.7Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M9 8.5c.2-.5.4-.5.7-.5h.5c.2 0 .3.1.4.4l.6 1.4c.1.2.1.4-.1.6l-.5.6c-.2.2-.2.3 0 .6.5.8 1.2 1.5 2.1 1.9.3.1.4.1.6-.1l.7-.8c.2-.2.3-.2.6-.1l1.3.6c.3.1.4.2.4.4 0 .3-.2 1.1-.7 1.5-.5.4-1 .6-1.7.5-.7-.1-1.6-.4-2.8-1.1-2.1-1.2-3.5-3.3-3.6-3.5-.1-.2-.8-1.1-.8-2.1s.5-1.5.7-1.7Z" fill="currentColor" />
              </svg>
            }
            @case ('email') {
              <svg viewBox="0 0 24 24" fill="none" focusable="false">
                <rect x="3" y="5" width="18" height="14" rx="1.5" stroke="currentColor" stroke-width="1.6" />
                <path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            }
            @case ('location') {
              <svg viewBox="0 0 24 24" fill="none" focusable="false">
                <path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z" stroke="currentColor" stroke-width="1.6" />
                <circle cx="12" cy="10" r="2.2" stroke="currentColor" stroke-width="1.6" />
              </svg>
            }
          }
        </span>
        <span class="contact-methods__copy">
          <span class="contact-methods__label">{{ method.label }}</span>
          <span class="contact-methods__value">{{ method.value }}</span>
        </span>
        <span class="contact-methods__arrow" aria-hidden="true">↗</span>
      </a>
    </li>
  }
</ul>
