<ul class="social-links" aria-label="Redes sociais">
  @for (link of visibleLinks; track link.id) {
    <li>
      <a
        class="social-links__link"
        [href]="link.href"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="link.label + ' (abre em nova aba)'"
      >
        <span class="social-links__icon" aria-hidden="true">
          @switch (link.platform.toLowerCase()) {
            @case ('instagram') {
              <svg viewBox="0 0 24 24" fill="none" focusable="false">
                <rect x="3.5" y="3.5" width="17" height="17" rx="5" stroke="currentColor" stroke-width="1.6" />
                <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6" />
                <circle cx="17.5" cy="6.8" r="1" fill="currentColor" />
              </svg>
            }
            @case ('tiktok') {
              <svg viewBox="0 0 24 24" fill="none" focusable="false">
                <path d="M14 3v11.2a3.8 3.8 0 1 1-3.2-3.75M14 3c.4 2.8 2.1 4.4 5 4.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            }
            @case ('facebook') {
              <svg viewBox="0 0 24 24" fill="currentColor" focusable="false">
                <path d="M13.4 21v-8h2.8l.4-3h-3.2V8.1c0-.9.3-1.5 1.6-1.5h1.7V3.9c-.3 0-1.3-.1-2.4-.1-2.4 0-4.1 1.5-4.1 4.2V10H7.5v3h2.7v8h3.2Z" />
              </svg>
            }
            @case ('x') {
              <svg viewBox="0 0 24 24" fill="none" focusable="false">
                <path d="m5 4 14 16M19 4 5 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            }
            @case ('youtube') {
              <svg viewBox="0 0 24 24" fill="none" focusable="false">
                <rect x="3" y="5.5" width="18" height="13" rx="4" stroke="currentColor" stroke-width="1.6" />
                <path d="m10 9 5 3-5 3V9Z" fill="currentColor" />
              </svg>
            }
            @default {
              <svg viewBox="0 0 24 24" fill="none" focusable="false">
                <path d="M14 4h6v6M20 4l-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              </svg>
            }
          }
        </span>
        <span class="social-links__label">{{ link.label }}</span>
        <span class="social-links__arrow" aria-hidden="true">↗</span>
      </a>
    </li>
  }
</ul>
